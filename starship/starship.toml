"$schema" = 'https://starship.rs/config-schema.json'

add_newline         = false
continuation_prompt = '[∙](bg4)'
format              = """$directory$character """
palette             = "gruber_darker"
right_format        = """$all"""
command_timeout     = 1000
scan_timeout        = 30

[character]
success_symbol            = '[➜](bold green)'
error_symbol              = '[✗](bold red1)'
vimcmd_symbol             = '[N](bold wisteria)'
vimcmd_visual_symbol      = '[V](bold yellow)'
vimcmd_replace_symbol     = '[R](bold brown)'
vimcmd_replace_one_symbol = '[r](bold brown)'

[cmd_duration]
min_time = 500
format   = 'took [$duration]($style) '
style    = 'bold brown'

[directory]
truncation_length = 3
truncate_to_repo  = true
format            = '[$path]($style)[$read_only]($read_only_style) '
style             = 'bold niagara'
read_only         = ' 🔒'

[aws]
disabled = true

[azure]
disabled = true

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)'
style  = 'bold yellow'

[git_metrics]
disabled      = false
added_style   = 'green'
deleted_style = 'red1'

[git_state]
style = 'bold brown'

[git_status]
format     = '([\[$all_status$ahead_behind\]]($style) )'
style      = 'red1'
conflicted = '🏳'
ahead      = '⇡${count}'
behind     = '⇣${count}'
diverged   = '⇕⇡${ahead_count}⇣${behind_count}'
untracked  = '?${count}'
stashed    = '📦'
modified   = '!${count}'
staged     = '+${count}'
renamed    = '»${count}'
deleted    = '✘${count}'

[status]
disabled = false
format   = '[$status]($style) '
style    = 'red1'

[env_var.DATABRICKS_CONFIG_PROFILE]
format = '[ $env_value]($style) '
style  = 'quartz'

[jobs]
symbol = '✦'
style  = 'bold wisteria'

[sudo]
disabled = false
style    = 'bold red1'

# -----------------------------#
#         LANGUAGES            #
# -----------------------------#
[golang]
symbol = ' ' 

[scala]
symbol = ' '

[java]
symbol = '󰬷 '

[docker_context]
disabled = true

[kubernetes]
disabled       = false
format         = '[$symbol$context( \($namespace\))]($style) '
style          = 'wisteria'
detect_files   = ['Chart.yaml', 'kustomization.yaml', 'skaffold.yaml']
detect_folders = ['k8s', 'helm', 'charts']

[[kubernetes.contexts]]
context_pattern = '.*prod.*'
style           = 'bold red1'
context_alias   = 'PROD'

[nodejs]
format = '[$symbol($version )]($style)'
symbol = ' '

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = ' '

[rust]
format = '[$symbol($version )]($style)'
symbol = ' '

