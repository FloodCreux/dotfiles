source-file ~/.config/tmux/tmux.reset.conf

# set-option -g default-terminal 'xterm-256color'
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g popup-style 'bg=default'
set -g popup-border-style 'fg=magenta,bg=default'

set -as terminal-features ",xterm*:RGB"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 10
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g status-style 'bg=#181818' #transparent
setw -g mode-keys vi

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g monitor-activity on            # Highlight windows with activity
set -g visual-activity off            # Don't show messages for activity (just highlight)

set  -g focus-events      on  		# Pass focus events to applications
set  -g aggressive-resize on            # Resize windows aggressively
setw -g automatic-rename  on            # Automatically rename windows based on running program
set  -g allow-rename      on 	        # Allow programs to rename windows

set -g mouse on

set -g status-left  "  #{?client_prefix,#[fg=magenta],#[fg=#ffdd33]}#[bg=#181818]#S"
set -g status-right "  #[fg=#8c8c8c,bg=#181818]%H:%M  "

set -g window-status-current-format '#[fg=#ffdd33,bg=#181818] #I:#W{?window_zoomed_flag, 󰊓,}'
set -g window-status-format         '#[fg=#4e4e4e,bg=#181818] #I:#W{?window_zoomed_flag, 󰊓,}'

set -g window-status-last-style 'fg=white,bg=black'

set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-interval 5

set -g display-time 2000 				# Display messages for 2 seconds
set -g display-panes-time 2000	# Display pane numbers for 2 seconds

set -g mode-style 'fg=#ffdd33,bg=#333333'

# set TMUX leader to C-a since C-b means something in vim
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'false'

set -g @continuum-restore 'on'

set -g @resurrect-captue-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"

bind i display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-cht

# Join pane from another window (prompts for window number)
bind-key J command-prompt -p "join pane from:" "join-pane -hs '%%'"

# Join the last window
bind-key @ join-pane -hs :!

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt

set -g @t-bind "none"
set -g @t-bind "K"

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

run '~/.tmux/plugins/tpm/tpm'

# Sesh
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind -N "last-session (via sesh) " P run-shell "sesh last"


bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" tv

# export GPG_TTY=$(tty)
