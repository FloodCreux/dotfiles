gui:
  theme:
    activeBorderColor:
      - '#ffdd33' # Gruber darker yellow accent
      - bold
    inactiveBorderColor:
      - '#52494e' # Muted border
    searchingActiveBorderColor:
      - '#f43841' # Gruber darker red
      - bold
    optionsTextColor:
      - '#e4e4ef' # Light text
    selectedLineBgColor:
      - '#453d41' # Subtle selection background
    selectedRangeBgColor:
      - '#52494e' # Range selection
    cherryPickedCommitBgColor:
      - '#453d41'
    cherryPickedCommitFgColor:
      - '#ffdd33'
    unstagedChangesColor:
      - '#f43841' # Red for unstaged
    defaultFgColor:
      - '#e4e4ef' # Main text color
    statusColors:
      added: '#73c936' # Gruber darker green
      modified: '#ffdd33' # Gruber darker yellow  
      deleted: '#f43841' # Gruber darker red
      renamed: '#96a6c8' # Gruber darker blue
      copied: '#9e95c7' # Gruber darker purple
      untracked: '#cc8c3c' # Gruber darker orange
    commitHashColor:
      - '#96a6c8' # Blue for commit hashes
    branchColors:
      current:
        - '#73c936' # Green for current branch
        - bold
      default:
        - '#e4e4ef' # Default text for other branches
    fileColors:
      added: '#73c936'
      modified: '#ffdd33'
      deleted: '#f43841'
      untracked: '#cc8c3c'
    diffColors:
      added: '#73c936'
      deleted: '#f43841'
      modified: '#ffdd33'
      context: '#e4e4ef'
  scrollHeight: 2
  scrollOffMargin: 2
  sidePanelWidth: 0.3333
  showDivergenceFromBaseBranch: arrowAndNumber
  expandFocusedSidePanel: false
  mainPanelSplitMode: 'flexible'
  language: 'auto'
  timeFormat: '02 Jan 06 15:04 MST'
  commitLength:
    show: true
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
  showFileTree: true
  showListFooter: true
  showRandomTip: false
  showBranchCommitHash: false
  showBottomLine: true
  showCommandLog: true
  nerdFontsVersion: "3"
git:
  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72
  commitPrefixes:
    "*":
      - pattern: "^\\w+/([A-Za-Z]+-\\d+).*"
        replace: "$1: "
  log:
    order: 'topo-order'
    showGraph: 'always'
    showWholeGraph: false
  merging:
    manualCommit: false
  diffRenderers:
    - command: delta --dark --paging=never
    - command: ydiff -p cat -s --wrap --width={{columnWidth}}
      colorArg: never
    - command: difft --color=always
      type: extDiff
    - colorArg: always
      useConfig: false
      type: rawGit
  pull:
    mode: 'rebase'
refresher:
  refreshInterval: 10
  fetchInterval: 60
os:
  editPreset: 'nvim'
customCommands:
  - key: 'X'
    description: 'Custom Command'
    commandMenu:
      - key: 'c'
        context: 'files'
        description: 'Conventional commit'
        loadingText: 'Commiting'
        prompts:
          - type: 'menu'
            key: 'Type'
            title: 'Commit type'
            options:
              - { value: 'feat',     description: 'New feature',     key: 'f' }
              - { value: 'fix',      description: 'Bug fix',         key: 'x' }
              - { value: 'refactor', description: 'Refactor',        key: 'r' }
              - { value: 'docs',     description: 'Documentation',   key: 'd' }
              - { value: 'chore',    description: 'Chore / tooling', key: 'c' }
              - { value: 'test',     description: 'Tests',           key: 't' }
              - { value: 'perf',     description: 'Performance',     key: 'p' }
              - { value: 'ci',       description: 'CI',              key: 'i' }
          - type: 'input'
            key: 'Scope'
            title: 'Scope (optional, e.g. tmux)'
          - type: 'menu'
            key: 'Breaking'
            title: 'Breaking change?'
            options:
              - { value: '',  description: 'No',  key: 'n' }
              - { value: '!', description: 'Yes', key: 'y' }
          - type: 'input'
            key: 'Message'
            title: 'Message'
        command: >-
          {{ $scope := "" }}{{ if .Form.Scope }}{{ $scope = printf "(%s)" .Form.Scope }}{{ end }}
          git commit -m {{ printf "%s%s%s: %s" .Form.Type $scope .Form.Breaking .Form.Message | quote }}
