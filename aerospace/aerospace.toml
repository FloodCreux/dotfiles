config-version = 2

after-login-command = []

after-startup-command = [
    'exec-and-forget borders active_color=0xffffcc00 inactive_color=0xff494d64 width=5.0',
]

accordion-padding = 30

automatically-unhide-macos-hidden-apps = false

default-root-container-layout      = 'tiles'
default-root-container-orientation = 'auto'

enable-normalization-flatten-containers                         = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-mode-changed            = ['exec-and-forget borders active_color=0xffff0000']

start-at-login = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = 10
outer.right      = 10

[mode.main.binding]

alt-enter = 'exec-and-forget open -a Ghostty'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-f = 'fullscreen'
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-r = 'mode resize'

alt-s = [
    'workspace T',
    'exec-and-forget tmux display-popup -E -w 80% -h 70% "sesh picker -i -H -d"',
]

alt-shift-f = 'layout floating tiling'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-q = 'close'

alt-shift-b = 'balance-sizes'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-c = 'workspace C'
alt-e = 'workspace E'
alt-m = 'workspace M'
alt-o = 'workspace O'
alt-t = 'workspace T'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-t = 'move-node-to-workspace T'

alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[mode.resize.binding]
h     = 'resize width -50'
l     = 'resize width +50'
j     = 'resize height +50'
k     = 'resize height -50'
b     = 'balance-sizes'
enter = 'mode main'
esc   = 'mode main'

[[on-window-detected]]
if.app-id = 'com.microsoft.edgemac'
run       = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run       = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run       = "move-node-to-workspace T"

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run       = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run       = "move-node-to-workspace C"

[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run       = "move-node-to-workspace E"

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run       = "move-node-to-workspace O"

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run       = "move-node-to-workspace M"

# [[on-window-detected]]
# if.app-id = 'com.superlogical.rex'
# run       = "move-node-to-workspace X"

[[on-window-detected]]
if.window-title-regex-substring = 'rayray'
run                             = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.cisco.anyconnect.gui'
run       = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run       = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.PlatformSSO.PlatformSSOUIAgent'
run       = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run       = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run       = 'layout floating'
