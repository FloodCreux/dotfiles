worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[post-start]
connect = '''
if [ -n "${TMUX:-}" ]; then
    sesh connect --switch --command '~/.config/sesh/scripts/dev_layout.sh' {{ worktree_path }}
elif [ -n "${REX_SESSION:-}" ]; then
    rex-connect {{ worktree_path }}
fi
'''

[post-switch]
connect = '''
if [ -n "${TMUX:-}" ]; then
    sesh connect --switch --command '~/.config/sesh/scripts/dev_layout.sh' {{ worktree_path }}
elif [ -n "${REX_SESSION:-}" ]; then
    rex-connect {{ worktree_path }}
fi
'''

[post-remove]
git  = "git pull --autostash --rebase origin main"
tmux = """
tmux list-sessions -F '#{session_name}\t#{session_path}' 2>/dev/null \
    | awk -F'\t' '$2 == "{{ worktree_path }}" {print $1' \
    | xargs -I{} tmux kill-session -t '={}'
"""

rex = '''
repo={{ repo }}
name=$(printf '%s/%s' "${repo%.git}" {{ worktree_name }} | tr '.:' '__')
rex --autostart=false kill "$name" 2>/dev/null || true
'''
