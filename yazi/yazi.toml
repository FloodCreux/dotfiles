[mgr]
show_hidden    = true
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
ratio          = [1, 3, 4] # parent : current : preview

[preview]
wrap       = "yes"
max_width  = 1200
max_height = 1800

[opener]
edit =[{ run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" }]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
