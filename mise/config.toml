[settings]
experimental = true
idiomatic_version_file_enable_tools = [
    "python",
    "node",
] # respect .python-version /.nvmrc
trusted_config_paths = ["~/personal", "~/work"]

[tools]
node        = "lts"
python      = "3.12"
dotnet      = "latest"
zig         = "latest"
opam        = "latest"
uv          = "latest"
just        = "latest"
terraform   = "latest"
k9s         = "latest"
kubectl     = "latest"
kubelogin   = "latest"
helm        = "latest"
helm-ls     = "latest"
ruff        = "latest"
gum         = "latest"
shellcheck  = "latest"
actionlint  = "latest"
azure-cli   = "latest"
awscli      = "latest"
tree-sitter = "latest"
jj          = "latest"
xh          = "latest"
argocd      = "latest"

"pipx:poetry" = "latest"
"pipx:mypy"   = "latest"

"npm:prettier"           = "latest"
"npm:@google/gemini-cli" = "latest"
