name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - name: setup.sh and uninstall.sh round trip
        run: |
          brew install stow
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.config/doom-emacs" "$HOME/.config/tmux/plugins/tpm"
          bash setup.sh
          bash uninstall.sh -y
          test -z "$(find "$HOME" -type l)"
